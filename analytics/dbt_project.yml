name: analytics

profile: analytics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  analytics:
    +static_analysis: strict
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: clean
    marts:
      +materialized: table
      +schema: warehouse
