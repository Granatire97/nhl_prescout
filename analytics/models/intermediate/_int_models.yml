models:
  - name: int_play_by_play
    description: Play by Play staging table with new event_key as the identifier
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: event_key
        description: Unique surrogate key identifying each play-by-play event.
        data_tests:
          - unique
          - not_null
      - name: sort_order
        description: Sequential integer indicating the chronological order of events within a game.
        data_tests:
          - not_null
      - name: game_id
        description: Unique NHL API identifier for the game.
        data_tests:
          - not_null
      - name: event_id
        description: NHL API event identifier within a given game.
        data_tests:
          - not_null
      - name: period
        description: Period number (1-3 for regulation, 4+ for overtime/shootout).
        data_tests:
          - not_null
      - name: period_type
        description: Period type (OT or REG).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [OT, REG]
      - name: time_in_period
        description: Elapsed time in the current period formatted as MM:SS.
      - name: event_period_seconds
        description: Elapsed time in the current period converted to integer seconds.
      - name: event_game_seconds
        description: Total elapsed game time in seconds across periods.
      - name: type_desc_key
        description: Event type identifier from the NHL API (e.g., shot-on-goal, hit, faceoff, stoppage).
        data_tests:
          - not_null
      - name: home_team_abbrev
        description: Three-letter abbreviation for the home team.
        data_tests:
          - not_null
      - name: away_team_abbrev
        description: Three-letter abbreviation for the away team.
        data_tests:
          - not_null
      - name: event_team_abbrev
        description: Three-letter abbreviation of the team credited with the event (NULL for neutral events like period-start).
      - name: home_team_defending_side
        description: The side the home team is defending
        data_tests:
          - accepted_values:
              arguments:
                values: [left, right]
      - name: x_raw
        description: X coordinate of the event
      - name: y_raw
        description: Y coordinate of the event
      - name: x_norm
        description: Normalized X coordinate of the event
      - name: y_norm
        description: Normalized Y coordinate of the event
      - name: details
        description: Nested JSON/struct containing event-specific metadata (coordinates, player IDs, shot types, etc.).
      - name: situation_code
        description: Four-digit NHL code representing goalie presence and skater counts (AwayGoalie, AwaySkaters, HomeSkaters, HomeGoalie).
      - name: away_goalie_in_net
        description: Flag indicating if the away goalie is on the ice (1 = in net, 0 = pulled/empty net).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: home_goalie_in_net
        description: Flag indicating if the home goalie is on the ice (1 = in net, 0 = pulled/empty net).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: away_skaters
        description: Number of non-goalie skaters on the ice for the away team.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3, 4, 5, 6]
      - name: home_skaters
        description: Number of non-goalie skaters on the ice for the home team.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3, 4, 5, 6]
      - name: is_home
        description: Boolean indicating whether the event was performed by the home team (NULL when event_team_abbrev is NULL).
      - name: opponent
        description: Three-letter abbreviation of the opposing team relative to the event team.
      - name: event_skaters
        description: Number of skaters on the ice for the event team.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3, 4, 5, 6]
      - name: opp_skaters
        description: Number of skaters on the ice for the opposing team.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3, 4, 5, 6]
      - name: is_empty_net_against
        description: Captures a boolean when the opponent net is empty
      - name: strength_state
        description: Categorized manpower state relative to the event team (EV, PP, PS, PK, EA, EN).
        data_tests:
          - accepted_values:
              arguments:
                values: [EV, PP, PS, PK, EA, EN]
      - name: skater_state
        description: Formatted manpower matchup string from the event team perspective (e.g., 5v5, 5v4).
      - name: shot_distance
        description: The distance of the shot from the goalies perspective
      - name: shot_angle
        description: The angle of the shot within the zone
      - name: loaded_at
        description: Timestamp indicating when the record was transformed and loaded by dbt.
        data_tests:
          - not_null
  - name: int_events_on_ice
    description: Players on the ice for a certain event
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_key, player_id]
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: event_ice_key
        description:
        data_tests:
          - not_null
      - name: event_key
        description: The column that stores the event_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_play_by_play')
                field: event_key
      - name: sort_order
        description: The column that stores the sort order
      - name: game_id
        description: The column that stores the game id
      - name: event_game_seconds
        description: The game seconds of the event
      - name: type_desc_key
        description: A description of what the event is
      - name: is_event_team
        description: Boolean to determine if that row belongs to the event team
      - name: player_id
        description: Player id of the event
        data_tests:
          - not_null
      - name: jersey_number
        description: Player jersey number of the event
        data_tests:
          - not_null
      - name: team_id
        description: Team id of the player
        data_tests:
          - not_null
      - name: team_abbrev
        description: Team abbrev of the player
      - name: shift_id
        description: Shift id of the player
      - name: position
        description: The position of the player
      - name: is_goalie
        description: Boolean to determine if the player is the goalie or not
      - name: loaded_at
        description: The time the row was loaded into the table
  - name: int_on_ice_validation
    description: Validation table to help check the match rate of expected vs actual skaters and players dressed over 6 player for either team.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: event_key
        description: Event key of the row
      - name: game_id
        description: The game id of the row
      - name: type_desc_key
        description: The description of the event
      - name: strength_state
        description: The strength state of the game
      - name: situation_code
        description: The situation code to describe whos on the ice
      - name: actual_home_skaters
        description: The actual number of home skaters
      - name: actual_home_goalie
        description: The actual number of home goalie
      - name: actual_away_skaters
        description: The actual number of away skaters
      - name: actual_away_goalie
        description: The actual number of away goalie
      - name: expected_home_skaters
        description: The expected number of home skaters
      - name: expected_home_goalie
        description: The expected number of home goalie
      - name: expected_away_skaters
        description: The expected number of away skaters
      - name: expected_away_goalie
        description: The expected number of away goalie
      - name: is_match
        description: Boolean to determine if the actual number of skaters is equal to the expected number of skaters

  - name: int_strength_intervals
    description: One row per game, team, and interval; team-perspective skater and goalie counts; strength labels; duration
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, team_abbrev, interval_start]
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: season
        description: NHL season identifier (e.g., 20252026).
        data_tests:
          - not_null
      - name: game_id
        description: Unique identifier for the NHL game.
        data_tests:
          - not_null
      - name: period
        description: Game period number.
        data_tests:
          - not_null
      - name: team_abbrev
        description: Three-letter abbreviation for the focal team.
        data_tests:
          - not_null
      - name: team_skaters
        description: Number of skaters on the ice for the focal team (excluding goalie).
        data_tests:
          - not_null
      - name: team_goalie_in_net
        description: Indicator (1 or 0) of whether the focal team has a goalie in net.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: opponent
        description: Three-letter abbreviation for the opposing team.
        data_tests:
          - not_null
      - name: opp_skaters
        description: Number of skaters on the ice for the opposing team (excluding goalie).
        data_tests:
          - not_null
      - name: opp_goalie_in_net
        description: Indicator (1 or 0) of whether the opposing team has a goalie in net.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: interval_start
        description: Start time of the strength interval in elapsed game seconds.
        data_tests:
          - not_null
      - name: interval_end
        description: End time of the strength interval in elapsed game seconds.
        data_tests:
          - not_null
      - name: duration_seconds
        description: Total length of the strength interval in seconds.
        data_tests:
          - not_null
      - name: strength_state
        description: Game strength state from the focal team's perspective (EV, PP, PK, EN, EA, PS).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["EV", "PP", "PK", "EN", "EA", "PS"]
      - name: skater_state
        description: Skater count matchup formatted as '<team_skaters>v<opp_skaters>' (e.g., '5v5', '5v4').
        data_tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the record was generated by dbt.
        data_tests:
          - not_null
