models:
  - name: stg_play_by_play
    description: Play by Play staging table with new event_key as the identifier
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: event_key
        description: Row identifier due to event_id being shared with multiple games
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: game_id column that houses the game id number
        data_tests:
          - not_null

      - name: period_type
        description: Period type (OT or REG).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["OT", "SO", "REG"]
      - name: home_team_abbrev
        description: Abbrevation for the Home Team
        data_tests:
          - not_null
      - name: away_team_abbrev
        description: Abbrevation for the Away Team
        data_tests:
          - not_null

  - name: stg_schedule
    description: Schedule staging table
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: game_id
        description: Row identifier due to each game on the schedule
        data_tests:
          - not_null
          - unique
      - name: home_team_abbrev
        description: Abbrevation for the Home Team
        data_tests:
          - not_null
      - name: away_team_abbrev
        description: Abbrevation for the Away Team
        data_tests:
          - not_null
      - name: game_type
        description: 1 preseason, 2 regular season, 3 playoffs
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: season
        description: Column that stores the season of the game
      - name: game_date
        description: Column that has the game dates
        data_tests:
          - not_null
      - name: start_time_utc
        description: The start time in UTC format
      - name: game_state
        description: The statement of the game to determine if its over
      - name: is_completed
        description: Column that determines if the game was completed or not
      - name: home_team_id
        description: Column that stores the id of the home team
      - name: away_team_id
        description: Column that stores the id of the away team
      - name: venue
        description: The venue of where the game was located
      - name: loaded_at
        description: The time the row was added to the table

  - name: stg_shifts
    description: Shifts staging table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id, start_game_seconds]
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: shift_id
        description: Column that houses the shift id number
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: Column that houses the game id number
        data_tests:
          - not_null
      - name: player_id
        description: Column that houses the player id number
        data_tests:
          - not_null
      - name: team_id
        description: Column that houses the team id number
      - name: team_abbrev
        description: Column that houses the team abbrevation
      - name: period
        description: Column that houses the period number
        data_tests:
          - not_null
      - name: shift_number
        description: Column that shows the shift number
      - name: start_period_seconds
        description: The start period in seconds
      - name: end_period_seconds
        description: The end period in seconds
      - name: start_game_seconds
        description: The start game in seconds
      - name: end_game_seconds
        description: The end game in seconds
      - name: duration_seconds
        description: Shift length in seconds, end_period_seconds minus start_period_seconds (not the raw duration field)
      - name: loaded_at
        description: Column that houses when the table was loaded

  - name: stg_boxscore_players
    description: Boxscore stats for players staging table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id]
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: game_id
        description: Column to house the game id of the row
        data_tests:
          - not_null
      - name: is_home
        description: Determining if the player was home
      - name: team_abbrev
        description: Column to house the team abbrevation of the player of the row
        data_tests:
          - not_null
      - name: player_id
        description: Column to house the player id of the row
        data_tests:
          - not_null
      - name: player_name
        description: The player name
      - name: position_group
        description: The position group of the player. Only F, D, or G
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["F", "D", "G"]
                quote: true
      - name: jersey_number
        description: The jersey number of the player
      - name: position
        description: The position of the player
      - name: goals
        description: Stat column for goals
      - name: assists
        description: Stat column for assists
      - name: points
        description: Stat column for points
      - name: toi_seconds
        description: Stat column for toi seconds
      - name: number_of_shifts
        description: Stat column for the number of shifts for that player
      - name: plus_minus
        description: Stat column for plus or minus
      - name: penalty_minutes
        description: Stat column for penalty minutes
      - name: hits
        description: Stat column for hits
      - name: shots_on_goal
        description: Stat column for shots on goal
      - name: blocked_shots
        description: Stat column for blocked shots
      - name: giveaways
        description: Stat column for giveaways
      - name: takeaways
        description: Stat column for takeaways
      - name: fo_pct
        description: Stat column for faceoff percentage
      - name: ppg
        description: Stat column for power play goals
      - name: saves
        description: Stat column for saves for goalies
      - name: shots_against
        description: Stat column for shots against for goalies
      - name: goals_against
        description: Stat column for goals against for goalies
      - name: save_pct
        description: Stat column for save percentage
      - name: game_decision
        description: Stat column for game decision for the goalies
      - name: loaded_at
        description: Time the data was loaded in the table

  - name: stg_roster_spots
    description: The roster for both teams in each game
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id]
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: game_id
        description: game_id column that houses the game id number
        data_tests:
          - not_null
      - name: season
        description: season column that houses the season of the game roster
        data_tests:
          - not_null
      - name: team_id
        description: team_id column that houses the team id number
        data_tests:
          - not_null
      - name: team_abbrev
        description: Abbrevation for the player team
        data_tests:
          - not_null
      - name: player_id
        description: player_id column that houses the player id number
        data_tests:
          - not_null
      - name: first_name
        description: Column that houses the players first name
      - name: last_name
        description: Column that houses the players last name
      - name: player_name
        description: Column that houses the players full name
      - name: jersey_number
        description: Column that houses the players jersey number
      - name: position
        description: Column that houses the players position
        data_tests:
          - accepted_values:
              arguments:
                values: ["C", "L", "R", "D", "G"]
                quote: true
      - name: loaded_at
        description: Column that houses when the data was loaded in the table
