models:
  - name: stg_play_by_play
    description: Play by Play staging table with new event_key as the identifier
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: event_key
        description: Row identifier due to event_id being shared with multiple games
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: game_id column that houses the game id number
        data_tests:
          - not_null
      - name: home_team_abbrev
        description: Abbrevation for the Home Team
        data_tests:
          - not_null
      - name: away_team_abbrev
        description: Abbrevation for the Away Team
        data_tests:
          - not_null
  - name: stg_schedule
    description: Schedule staging table
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: game_id
        description: Row identifier due to each game on the schedule
        data_tests:
          - not_null
          - unique
      - name: home_team_abbrev
        description: Abbrevation for the Home Team
        data_tests:
          - not_null
      - name: away_team_abbrev
        description: Abbrevation for the Away Team
        data_tests:
          - not_null
      - name: game_type
        description: 1 preseason, 2 regular season, 3 playoffs
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: season
        description: Column that stores the season of the game
      - name: game_date
        description: Column that has the game dates
        data_tests:
          - not_null
      - name: start_time_utc
        description: The start time in UTC format
      - name: game_state
        description: The statement of the game to determine if its over
      - name: is_completed
        description: Column that determines if the game was completed or not
      - name: home_team_id
        description: Column that stores the id of the home team
      - name: away_team_id
        description: Column that stores the id of the away team
      - name: venue
        description: The venue of where the game was located
      - name: loaded_at
        description: The time the row was added to the table
