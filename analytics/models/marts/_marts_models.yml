models:
  - name: dim_players
    description: Dimension table for players. One row per player id and season
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, season]
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: player_key
        description: Unique surrogate key identifying each player with player_id and season
        data_tests:
          - unique
          - not_null
      - name: season
        description: Column that holds the season value
        data_tests:
          - not_null
      - name: team_id
        description: Column that holds the latest team id value for the player
        data_tests:
          - not_null
      - name: team_abbrev
        description: Column that holds the latest team abbrev value for the player
      - name: player_id
        description: The player id of the player
        data_tests:
          - not_null
      - name: first_name
        description: The first name of the player
      - name: last_name
        description: The last name of the player
      - name: player_name
        description: The player name
        data_tests:
          - not_null
      - name: jersey_number
        description: Column that holds the latest jersey number value for the player
      - name: position
        description: Column that holds the latest position value for the player
        data_tests:
          - not_null
      - name: games_played
        description: Column that holds the number of games the player was dressed for. Counts only games in loaded team schedules.
      - name: all_teams
        description: Column that holds a string with all the teams a player played for a certain season
      - name: loaded_at
        description: Column that holds when the value was added to the table
