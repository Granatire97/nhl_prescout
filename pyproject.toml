[project]
name = "nhl-prescout"
version = "0.1.0"
description = "NHL opponent pre-scout tool"
requires-python = ">=3.13"
dependencies = [
    "dagster",
    "dagster-webserver",
    "dagster-dbt",
    "dbt-duckdb",
    "duckdb",
    "httpx",
    "pyyaml",
    "aiohttp",
    "tqdm",
]

[project.optional-dependencies]
notebook = [
    "pandas",
    "numpy",
    "seaborn",
    "matplotlib",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.dagster]
module_name = "pipeline.definitions"